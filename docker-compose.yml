services:
  wordpress:
    image: wordpress:6.5.3-php8.2-apache
    container_name: wp_app
    restart: unless-stopped
    ports:
      - "8106:80" # changed from 8080 due to local port conflict
    volumes:
      - ./docroot:/var/www/html:rw,cached
      - ./config/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
    depends_on:
      - db
    networks:
      - wpnet

  db:
    image: mariadb:11.3
    container_name: wp_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME}
      MARIADB_USER: ${WP_DB_USER}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - wpnet

networks:
  wpnet:
    driver: bridge
    driver_opts:
            com.docker.network.driver.mtu: "1450"

